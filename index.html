<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blank Arena</title>
<style>
html, body { margin: 0; height: 100%; background: #111; color: #bbb; font: 12px ui-monospace, monospace; }
#lanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
  gap: 4px; height: 100%; padding: 4px; box-sizing: border-box; }
@media (max-width: 760px) { #lanes { height: auto; grid-auto-rows: 75vh; } }
.lane { display: flex; flex-direction: column; min-height: 0; border: 1px solid #333; }
.lane header { display: flex; gap: 6px; align-items: center; padding: 4px 6px; background: #1b1b1b; }
.lane header b { color: #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 35%; }
.lane .state { flex: 1; min-width: 0; display: flex; gap: 6px; align-items: center; text-align: left;
  background: none; border: 0; padding: 2px 0; color: #ccc; }
.lane .state span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lane .state i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--c, #888); }
.lane .state[data-k=working] i { --c: #3c3; animation: pulse 1.2s infinite; }
.lane .state[data-k=done] i { --c: #ddd; }
.lane .state[data-k=key] i, .lane .state[data-k=model] i { --c: #e33; }
.lane .state[data-k=credit] i, .lane .state[data-k=network] i { --c: #f90; }
.lane .state[data-k=bug] i { --c: #b5f; }
@keyframes pulse { 50% { opacity: .3; } }
.lane .log { max-height: 40%; overflow: auto; margin: 0; padding: 6px; background: #161616;
  border-bottom: 1px solid #333; white-space: pre-wrap; word-break: break-word; }
.lane iframe { flex: 1; width: 100%; border: 0; background: #fff; }
#start { max-width: 520px; margin: 10vh auto; padding: 0 16px; display: grid; gap: 10px; }
#start h1 { margin: 0; color: #eee; font-size: 18px; }
#start p { margin: 0; line-height: 1.5; }
#start input, #start select { font: inherit; font-size: 16px; padding: 8px; background: #1b1b1b;
  color: #eee; border: 1px solid #444; width: 100%; box-sizing: border-box; }
#start button { font-size: 16px; padding: 10px; }
#picked:empty::before { content: 'no models yet: search below'; color: #777; }
.chip { display: inline-flex; gap: 6px; align-items: center; margin: 0 6px 6px 0; padding: 4px 4px 4px 8px;
  border: 1px solid #444; background: #222; color: #eee; }
#start .chip button { padding: 0 6px; font-size: 14px; }
#matches { display: grid; }
#start #matches button { text-align: left; padding: 8px; border-top: 0; font-size: 14px; }
#matches small { display: block; color: #888; }
button { font: inherit; background: #2a2a2a; color: #ccc; border: 1px solid #444; cursor: pointer; }
</style>

<template id="system">
You are running in a simple harness in an otherwise blank HTML document,
inside a sandboxed iframe. Each assistant message is evaluated as a
javascript expression, as `(async () => (YOUR_MESSAGE))()`; the result
(or the error) is returned to you as a new user message, along with any
uncaught errors your code raised in the background since your last turn.
You can examine the document with `document.documentElement.innerHTML`.

The iframe has an opaque origin: localStorage and cookies are unavailable,
but you can load scripts and modules from CDNs, e.g.
`import('https://esm.sh/three')`.

You can do anything you like, including communicating with the user,
but you would need to build an interface to do that. If you do this,
remember the agent loop only pauses for user input when evaluating a
promise that blocks waiting for it.

Everything you send is evaluated as code, so prose is a syntax error: to
talk to the user, put words on the page. When you have finished, evaluate
`done()` (or `done('a parting note')`) and the loop will stop calling you.

You have {TURNS} turns. {CONTEXT}
</template>

<script>
/* Blank Arena: the blank-page harness, several at once.
   Built on Chris Webb's original handwritten blank-page agent harness.
   In the console:  arena('sk-or-...')
                    arena(key, { models: [...], turns: 40, dare: 'make me laugh' })
                    arena(key, { mode: 'relay', models: [a, b, c] })   // one page, passed hand to hand
   Each lane is a sandboxed iframe with no access to this page, so the key stays out
   of reach of the code being run. "replay" downloads a standalone HTML file that
   re-runs the lane's successful actions in order: no model, no key needed. */

const DEFAULT_MODELS = ['openai/gpt-6.1-sol'];   // add more OpenRouter model ids here
const MAX_RESULT = 8000;                          // chars of each eval result sent back

const CONTEXT = {
  arena: 'Other models are running beside you, each in its own identical blank '
       + 'document, and the user is watching all of you at once.',
  first: n => `You are the first of ${n} models who will work in this document in turn, `
       + 'each starting with no memory. Later models inherit what you leave in the page, '
       + 'but not this conversation.',
  later: (i, n) => `You are model ${i + 1} of ${n} to work in this document. `
       + `${i == 1 ? 'One model' : i + ' models'} before you left it as you will find it; you cannot talk to them, and `
       + 'you have none of their memory. Look around before you act. Later models will '
       + 'inherit what you leave.',
};

const BRIDGE = `<!doctype html><meta charset="utf-8"><script>
const bg = [];
let finished = false;
window.done = note => (finished = true, note ?? 'done');
addEventListener('error', e => bg.push(String(e.message)));
addEventListener('unhandledrejection', e => bg.push('unhandled rejection: ' + (e.reason && e.reason.message || e.reason)));
function pack(r) {
  if (bg.length) r.backgroundErrors = bg.splice(0, 20);
  const seen = new WeakSet();
  let s;
  try {
    s = JSON.stringify(r, (k, x) => {
      if (x === undefined) return '[undefined]';
      if (typeof x === 'function') return '[Function ' + (x.name || 'anonymous') + ']';
      if (typeof x === 'bigint') return x + 'n';
      if (x instanceof Node) return '[' + x.nodeName + (x.id ? '#' + x.id : '') + ']';
      if (x instanceof Error) return x.name + ': ' + x.message;
      if (x && typeof x === 'object') { if (seen.has(x)) return '[Repeated]'; seen.add(x); }
      return x;
    });
  } catch (e) { s = JSON.stringify({ error: 'unserialisable result: ' + e.message }); }
  return s.length > ${MAX_RESULT} ? s.slice(0, ${MAX_RESULT}) + ' ...[truncated ' + (s.length - ${MAX_RESULT}) + ' chars]' : s;
}
addEventListener('message', async e => {
  if (e.source !== parent) return;
  const { id, code } = e.data;
  let r, ok = true;
  try { r = { result: await (0, eval)('(async () => (' + code + '))()') }; }
  catch (err) {
    r = { error: String(err && err.message || err) }; ok = false;
    if (err instanceof SyntaxError) r.hint = 'your whole message is evaluated as one JavaScript expression';
  }
  parent.postMessage({ id, ok, done: finished, out: pack(r) }, '*');
  finished = false;
});
<\/script>`;

function makeLane(title) {
  const el = document.createElement('div');
  el.className = 'lane';
  el.innerHTML = '<header><b></b><button class="state" title="tap for details"><i></i><span>starting</span></button>'
    + '<button data-a="skip">skip</button><button data-a="stop">stop</button>'
    + '<button data-a="replay">replay</button></header><pre class="log" hidden></pre>';
  const frame = document.createElement('iframe');
  frame.sandbox = 'allow-scripts allow-modals allow-forms allow-pointer-lock allow-popups allow-downloads';
  frame.allow = 'fullscreen; autoplay; gamepad; xr-spatial-tracking';
  frame.srcdoc = BRIDGE;
  el.append(frame);
  document.getElementById('lanes').append(el);
  el.querySelector('b').textContent = title;

  const l = { title, frame, steps: [], tokens: 0, stop: false, skip: false, pending: null, abort: null,
    ready: new Promise(r => frame.onload = r),
    // kind: working | done | key | credit | model | network | bug
    status: (kind, text) => {
      const st = el.querySelector('.state');
      st.dataset.k = kind;
      st.querySelector('span').textContent = text;
    },
    log: text => {
      const pre = el.querySelector('.log'), stick = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 4;
      pre.textContent = (pre.textContent + new Date().toTimeString().slice(0, 8) + '  ' + text + '\n').slice(-20000);
      if (stick) pre.scrollTop = pre.scrollHeight;
    } };
  el.querySelector('.state').onclick = () => { const pre = el.querySelector('.log'); pre.hidden = !pre.hidden; };
  const halt = (all) => { l.skip = true; if (all) l.stop = true; l.abort?.abort(); l.pending?.(); };
  el.querySelector('[data-a=skip]').onclick = () => halt(false);
  el.querySelector('[data-a=stop]').onclick = () => halt(true);
  el.querySelector('[data-a=replay]').onclick = () => exportReplay(l);
  return l;
}

function evalIn(l, code) {
  return new Promise(resolve => {
    const id = crypto.randomUUID();
    const done = msg => { removeEventListener('message', h); l.pending = null; resolve(msg); };
    const h = e => { if (e.source === l.frame.contentWindow && e.data?.id === id) done(e.data); };
    addEventListener('message', h);
    l.pending = () => done({ ok: false, out: '{"error":"stopped by user"}' });
    l.frame.contentWindow.postMessage({ id, code }, '*');
  });
}

// Models sometimes wrap their code in a markdown fence; the original harness would choke on it.
const unfence = t => (t.trim().match(/^```[\w-]*\n([\s\S]*?)\n?```$/) || [, t])[1];

const systemPrompt = (turns, context, dare) =>
  document.getElementById('system').innerHTML.trim()
    .replace('{TURNS}', turns).replace('{CONTEXT}', context)
  + (dare ? `\n\nThe user has left you a dare: ${dare}` : '');

// Sort an OpenRouter failure into something a person can act on.
function classify(code, message) {
  const m = message ? ': ' + message : '';
  if (code == 401) return ['key', 'key rejected', `the key is wrong, expired or revoked${m}`];
  if (code == 402) return ['credit', 'out of credit', `the key works but has no credit left${m}`];
  if (code == 400 || code == 404) return ['model', 'model unavailable', `wrong model id, or it can't be used with this page${m}`];
  if (code == 403) return ['model', 'request refused', `the provider refused the request${m}`];
  if (code == 408 || code == 429 || code >= 500) return ['network', 'provider busy or down', `try again shortly${m}`];
  return ['bug', 'unexpected error', `HTTP ${code}${m}`];
}

const kTok = n => n < 1000 ? n + ' tok' : (n / 1000).toFixed(1) + 'k tok';

async function runAgent(key, l, model, system, turns) {
  const conversation = [{ role: 'system', content: system }];
  const fail = ([kind, short, detail]) => { l.status(kind, short); l.log(`${model} ✗ ${short}: ${detail}`); };
  l.skip = false;
  l.log(`${model}: starting, ${turns} turns`);
  for (let t = 1; t <= turns && !l.skip; t++) {
    const t0 = Date.now(), waiting = () =>
      l.status('working', `thinking ${Math.round((Date.now() - t0) / 1000)}s · turn ${t}/${turns} · ${kTok(l.tokens)}`);
    waiting();
    const ticker = setInterval(waiting, 1000);
    l.log(`turn ${t}: asking the model`);
    let response;
    try {
      l.abort = new AbortController();
      response = await fetch('https://openrouter.ai/api/v1/responses', {
        method: 'POST', signal: l.abort.signal,
        headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ model, cache_control: { type: 'ephemeral' }, input: conversation, store: false }),
      });
      if (!response.ok) {
        const text = await response.text();
        let message = text.slice(0, 300);
        try { message = JSON.parse(text).error?.message || message; } catch {}
        console.log(model, text);
        return fail(classify(response.status, message));
      }
      response = await response.json();
    } catch (error) {
      console.log(model, error);
      if (l.skip) { l.status('done', 'stopped'); l.log(`${model}: stopped`); return; }
      return fail(['network', 'network problem', `couldn't reach OpenRouter (${error.message})`]);
    } finally {
      clearInterval(ticker);
    }
    if (!Array.isArray(response.output)) {
      console.log(model, response);
      const e = response?.error;
      return fail(e ? classify(+e.code || 0, e.message) : ['bug', 'unexpected response', JSON.stringify(response).slice(0, 300)]);
    }
    l.tokens += response.usage?.total_tokens || 0;
    l.log(`turn ${t}: replied after ${Math.round((Date.now() - t0) / 1000)}s`);

    for (const item of response.output) {
      conversation.push(item);
      console.log(model, item);
    }
    for (const item of response.output) {
      if (item.role != 'assistant') continue;
      for (const content of item.content) {
        if (content.type != 'output_text') continue;
        const code = unfence(content.text);
        const r0 = Date.now(), running = () => {
          const secs = Math.round((Date.now() - r0) / 1000);
          l.status('working', `running its code${secs > 10 ? ` ${secs}s · may be waiting for you` : ''} · turn ${t}/${turns}`);
        };
        running();
        const runTicker = setInterval(running, 1000);
        const { ok, done, out } = await evalIn(l, code);
        clearInterval(runTicker);
        if (ok) l.steps.push(code);
        let brief = '';
        try { const r = JSON.parse(out); brief = r.error ? '✗ ' + r.error : '✓'; if (r.backgroundErrors) brief += ` (${r.backgroundErrors.length} background error(s))`; }
        catch { brief = ok ? '✓' : '✗'; }
        l.log(`turn ${t}: its code ran ${brief}`.slice(0, 300));
        conversation.push({ type: 'message', role: 'user', content: out });
        console.log(model, out);
        if (done) {
          l.status('done', `finished · ${t} turns · ${kTok(l.tokens)}`);
          l.log(`${model}: finished by itself`);
          return;
        }
      }
    }
  }
  l.status('done', `${l.skip ? 'stopped' : 'out of turns'} · ${kTok(l.tokens)}`);
  l.log(`${model}: ${l.skip ? 'stopped' : 'used all its turns'}`);
}

async function arena(key, { models = DEFAULT_MODELS, turns = 40, dare = '', mode = 'arena' } = {}) {
  if (mode == 'relay') {
    const l = makeLane('relay: ' + models.join(' → '));
    await l.ready;
    for (const [i, model] of models.entries()) {
      if (l.stop) break;
      const context = i ? CONTEXT.later(i, models.length) : CONTEXT.first(models.length);
      await runAgent(key, l, model, systemPrompt(turns, context, dare), turns);
    }
    return;
  }
  await Promise.all(models.map(async model => {
    const l = makeLane(model);
    await l.ready;
    await runAgent(key, l, model, systemPrompt(turns, CONTEXT.arena, dare), turns);
  }));
}

function exportReplay(l) {
  const steps = JSON.stringify(l.steps).replace(/</g, '\\u003c');
  const title = l.title.replace(/</g, '&lt;');
  const html = `<!doctype html><meta charset="utf-8"><title>${title}: replay</title><script>
// What ${title} did with a blank page: its successful actions, re-run in order.
// No model and no key. A step that waited for user input will wait for you too.
const steps = ${steps};
const done = note => note;
addEventListener('load', async () => { for (const s of steps) {
  try { await (0, eval)('(async () => (' + s + '))()'); } catch (e) { console.warn(e); }
} });
<\/script>`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
  a.download = l.title.replace(/[^\w.-]+/g, '_') + '.replay.html';
  a.click();
}
</script>
</head><body>
<form id="start">
  <h1>Blank Arena</h1>
  <p>Give some models an empty web page and see what they do with it.
     Your OpenRouter key stays in this tab and is only sent to OpenRouter.</p>
  <p style="color:#777">Built on Chris Webb's original blank-page harness.</p>
  <input name="key" type="password" placeholder="OpenRouter key (sk-or-...)" required autocomplete="off">
  <div id="picked"></div>
  <div><input id="find" placeholder="add a model: type to search" autocomplete="off"><div id="matches"></div></div>
  <input name="dare" placeholder="a dare (optional)">
  <select name="mode"><option value="arena">side by side</option><option value="relay">relay: one page, passed hand to hand</option></select>
  <label>turns per model<input name="turns" type="number" min="1" max="200" value="40"></label>
  <button>start</button>
</form>
<div id="lanes"></div>
<script>
const form = document.getElementById('start');
const find = document.getElementById('find');

// Model picker: search OpenRouter's public model list, tap to add, x to remove.
let picked = [], catalogue = [];
try { picked = JSON.parse(localStorage.getItem('arena.models')) || []; } catch {}
if (!Array.isArray(picked) || !picked.length) picked = [...DEFAULT_MODELS];

const perM = n => +(n * 1e6).toFixed(2);
const price = p => {
  const i = +p?.prompt, o = +p?.completion;
  if (!(i >= 0 && o >= 0)) return '';
  return i || o ? `$${perM(i)} in / $${perM(o)} out per M tokens` : 'free';
};

function showPicked() {
  const box = document.getElementById('picked');
  box.replaceChildren(...picked.map(id => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = id;
    const x = document.createElement('button');
    x.type = 'button';
    x.textContent = '×';
    x.title = 'remove';
    x.onclick = () => { picked = picked.filter(p => p != id); showPicked(); };
    chip.append(x);
    return chip;
  }));
  try { localStorage.setItem('arena.models', JSON.stringify(picked)); } catch {}
}

function matches() {
  const words = find.value.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  return catalogue.filter(m => !picked.includes(m.id)
    && words.every(w => (m.id + ' ' + m.name).toLowerCase().includes(w))).slice(0, 8);
}

function showMatches() {
  document.getElementById('matches').replaceChildren(...matches().map(m => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = m.name;
    const small = document.createElement('small');
    small.textContent = [m.id, m.price].filter(Boolean).join(' · ');
    b.append(small);
    b.onclick = () => add(m.id);
    return b;
  }));
}

function add(id) {
  if (id && !picked.includes(id)) picked.push(id);
  find.value = '';
  showPicked();
  showMatches();
  find.focus();
}

find.oninput = showMatches;
find.onkeydown = e => {
  if (e.key == 'Escape') { find.value = ''; showMatches(); }
  if (e.key != 'Enter') return;
  e.preventDefault();
  // first match, or a typed id that isn't in the list (e.g. a brand-new model)
  add(matches()[0]?.id || (find.value.includes('/') ? find.value.trim() : ''));
};

fetch('https://openrouter.ai/api/v1/models')
  .then(r => r.json())
  .then(d => { catalogue = d.data.map(m => ({ id: m.id, name: m.name || m.id, price: price(m.pricing) })); showMatches(); })
  .catch(() => find.placeholder = 'add a model id, e.g. openai/gpt-6.1-sol (list unavailable)');
showPicked();

form.onsubmit = e => {
  e.preventDefault();
  if (!picked.length) { find.focus(); return; }
  const models = [...picked];
  form.remove();
  arena(form.key.value.trim(), { models, dare: form.dare.value.trim(), mode: form.mode.value, turns: +form.turns.value || 40 });
};
const _arena = arena;
arena = (...a) => { form.remove(); return _arena(...a); };   // console use still works
</script>
</body></html>
